services:
  # -----------------------------------------------------------------
  # 1. App Service (Backend) - Optimized for Local Development
  # -----------------------------------------------------------------
  app:
    build:
      context: ./app
      # IMPORTANT: Use a dedicated development Dockerfile (e.g., installs dev dependencies, runs dev server)
      dockerfile: Dockerfile
    env_file: .env
    # Map local code into the container for hot-reloading
    volumes:
      - ./app:/app
    # Expose the application port directly
    ports:
      - "8000:8000" # Assuming your app runs on port 8000 in the container
    environment:
      # SOCKS5_PROXY is kept as it's a core dependency
#      - SOCKS5_PROXY=xray:10808
      - DEBUG=True

    restart: on-failure # Changed from unless-stopped for dev environment

    depends_on:
      # Use service_healthy for robustness in dev too
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
#      xray:
#        condition: service_started

  click_processor:
    build:
      context: ./app
    command: python -m src.services.click_processor  # دستور واحد برای اجرای این سرویس
    env_file: .env
    depends_on:
      - db
      - cache
    deploy:
      resources:
        limits:
          memory: 256M # حافظه تقسیم شده
    volumes:
      - ./app:/app
    restart: always # برای تضمین اجرای مداوم سرویس

#    # سرویس دوم: مصرف‌کننده پرش از تبلیغ
#  ad_skip_consumer:
#    build:
#      context: ./app
#    command: python -m src.services.ad_skip_consumer # دستور واحد برای اجرای این سرویس
#    env_file: .env
#    depends_on:
#      - db
#      - cache
#    deploy:
#      resources:
#        limits:
#          memory: 256M # حافظه تقسیم شده
#    volumes:
#      - ./app:/app
#    restart: always # برای تضمین اجرای مداوم سرویس

  # -----------------------------------------------------------------
  # 2. Proxy Service (Kept as a core dependency)
  # -----------------------------------------------------------------
#  xray:
#    build: ./xray
#    container_name: xray
#    # Expose internal ports only if needed for testing, otherwise leave them for app access
#    ports:
#      - "10808:10808"
#    restart: unless-stopped

  # -----------------------------------------------------------------
  # 3. Database Service (Postgres) - Exposed Port
  # -----------------------------------------------------------------
  db:
    image: docker.arvancloud.ir/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    # Exposed port for local tools (e.g., DBeaver, VS Code extensions)
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 4. Cache Service (Redis) - Exposed Port
  # -----------------------------------------------------------------
  cache:
    image: docker.arvancloud.ir/redis:latest
    restart: unless-stopped
    # Exposed port for local Redis inspection/tools
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 5. PGAdmin (Database Management GUI) - Exposed Port
  # -----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: app_pgadmin
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    # Expose port 5050 to access pgAdmin locally via http://localhost:5050
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------------------------
  # 6. Nginx Service (Removed for Dev)
  # -----------------------------------------------------------------
  # The Nginx service has been removed. You should run your frontend
  # development server (e.g., npm run dev) separately on your host machine.

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./link-shortener-next:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - app

volumes:
  postgres_data:
  pgadmin_data:

# Networks section removed/simplified: Compose will create a default bridge network for all services automatically.