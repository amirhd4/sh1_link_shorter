add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;


ssl_protocols TLSv1.2 TLSv1.3;


server {
    listen 80;
    server_name pgadmin.l1s.ir;

    # acme challenge برای تمدید گواهی
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # بقیه را به HTTPS هدایت کن
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    http2 on;

    server_name pgadmin.l1s.ir;

    # گواهی که در خروجی certs شما مشخص شده است
    ssl_certificate /etc/letsencrypt/live/pgadmin.l1s.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgadmin.l1s.ir/privkey.pem;
    
    # فایل‌های امنیتی مشترک
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # پیکربندی پروکسی
    location / {
        proxy_pass http://app_pgadmin;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    
 }

server {
    listen 80;
    server_name l1s.ir www.l1s.ir;

    # acme challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # بقیه را به HTTPS هدایت کن
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name l1s.ir www.l1s.ir;

    ssl_certificate /etc/letsencrypt/live/l1s.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l1s.ir/privkey.pem;
    # اگر certbot فایل‌های کمکی ساخت، include کن
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;


    # Allow verification files
    # location ^~ /.well-known/ {
    #     root /usr/share/nginx/html;
    #     allow all;
    #     default_type text/plain;
    # }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(woff2|woff|ttf|eot|svg|js|css|json)$ {
        add_header X-Content-Type-Options nosniff;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = / {
        return 302 /pages/;
    }

    location /pages/ {
        limit_req zone=one burst=10 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /pages/index.html;
    }


    # api backend
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /robots.txt {
        alias /usr/share/nginx/html/pages/robots.txt;
    }

    # Short URLs (1–10 chars)
    location ~ "^/[a-zA-Z0-9_-]{1,10}$" {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/ad/skip/\d+/[a-zA-Z0-9_-]{1,10}$" {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker - باید همیشه از root و بدون cache سرو بشه
    location = /pages/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Web App Manifest
    location = /pages/manifest.json {
        add_header Content-Type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # App icons
    location ~* ^/pages/icons/.*\.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

}

# mail UI (reverse-proxy به nginxِ داخل mailcow)
server {
    listen 80;
    server_name mail.l1s.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.l1s.ir;

    ssl_certificate /etc/letsencrypt/live/mail.l1s.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.l1s.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    proxy_buffering off;

    location / {
        # نام هاستِ کانتینر mailcow را جایگزین کن اگر متفاوت است
        proxy_pass http://mailcowdockerized-nginx-mailcow-1:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;
    }
}
