# ---------- Frontend (Next.js) ----------
server {
    listen 3000;
    server_name localhost;

    # HMR for Next.js (Hot Module Replacement)
    location /_next/webpack-hmr {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /_next/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }



    # Allowing access to localhost for development without restrictions
    location /_next/static/ {
        proxy_pass http://host.docker.internal:3000;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ---------- Backend (FastAPI) ----------

limit_req_zone $binary_remote_addr zone=one:1m rate=5r/s;

server {
    listen 8000;
    server_name localhost;

    # Enable Debugging and Logging for FastAPI API
    access_log /var/log/nginx/dev_access.log;
    error_log /var/log/nginx/dev_error.log debug;

    location /api/uploads/ {
        proxy_pass http://app:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=one burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Short URL Pattern Handling
    location ~ "^/[a-zA-Z0-9_-]{1,}$" {
        proxy_pass http://app:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/ad/skip/\d+/[a-zA-Z0-9_-]{1,}$" {
        proxy_pass http://app:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable caching for development purposes
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|json|html|map|woff|woff2|ttf|eot|svg)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
}

