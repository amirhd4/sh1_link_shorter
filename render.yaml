services:
  # FastAPI + Click Processor
  - type: web
    name: shortener-api
    runtime: docker
    region: frankfurt
    plan: free

    dockerContext: ./app
    dockerfilePath: ./app/Dockerfile.render.prod

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shortener-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shortener-redis
          property: connectionString

      - key: DEBUG
        value: "False"

      - key: CAPTCHA
        value: "False"

      - key: FRONTEND_URL
        sync: false

      - key: BACKEND_URL
        sync: false

      - key: ORIGIN_BACKEND_URL
        sync: false

      - key: IP_HASH_SECRET
        generateValue: true

      - key: GOOGLE_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"

      - key: SECRET_NOTE_KEY
        generateValue: true

      - key: ZARINPAL_MERCHANT_ID
        sync: false

      - key: ZARINPAL_SANDBOX_MODE
        value: "False"

      - key: SMS_IR_API_KEY
        sync: false

      - key: SMS_IR_LINE_NUMBER
        sync: false

      - key: SMS_IR_TEMPLATE_ID
        sync: false

      - key: SMS_IR_VERIFY_TEMPLATE_ID
        sync: false

      - key: CT_SITE_KEY
        sync: false

      - key: CT_SECRET_KEY
        sync: false

      - key: AD_VIEW_REWARD_POINTS
        value: "10"

      - key: GEOIP_DB_PATH
        value: /app/GeoLite2-City.mmdb

    # Redis compatible Key Value
  - type: keyvalue
    name: shortener-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: shortener-db
    region: frankfurt
    plan: free
    databaseName: link_shortener_db
    user: shortener_user
