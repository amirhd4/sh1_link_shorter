services:
  db:
    image: docker.arvancloud.ir/postgres:16-alpine
    volumes:
      - postgres_dataa:/var/lib/postgresql/data/
      - ./app/alembic:/app/alembic
      - ./app/alembic.ini:/app/alembic.ini

    env_file: .env
    ports:
       - "5432:5432"  # Add this line to expose the port
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_dataa:
  pgadmin_data: