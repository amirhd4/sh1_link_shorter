  db:
    image: docker.arvancloud.ir/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./app/alembic:/app/alembic
      - ./app/alembic.ini:/app/alembic.ini
      
    env_file: .env
    # ports:
    #   - "5432:5432"  # Add this line to expose the port
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.arvancloud.ir/redis:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: docker.arvancloud.ir/nginx:1.25-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "80:80"
      - "443:443"
    volumes:
#    - ./link-shortener-frontend/dist:/usr/share/nginx/html/pages
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    # - ./nginx/conf.d:/etc/nginx/conf.d
    # - ./nginx/conf:/etc/nginx/conf.d
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - /var/www/letsencrypt:/var/www/letsencrypt

    networks:
      - 1sl_default
    depends_on:
      - app
      - frontend

  pgadmin:
    image: dpage/pgadmin4
    container_name: app_pgadmin
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - db
        
    networks:
      - 1sl_default # مهم: قرار دادن در شبکه مشترک با Nginx و DB
    # مهم: پورت‌ها را اینجا expose نکنید. Nginx مدیریت را انجام می‌دهد.

  frontend:
    build:
      context: ./link-shortener-next
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - 1sl_default
  
volumes:
  postgres_data:
  pgadmin_data:

networks:
  1sl_default:
    external: true

#  mailcowdockerized_mailcow-network:
