services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      - SOCKS5_PROXY=172.17.0.1:10808
      - DEBUG=False
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      xray:
        condition: service_started

  worker:
    build:
      context: ./app
    command: python src/services/click_processor.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./app/src:/app/src

      
  xray:
    build: ./xray
    container_name: xray
    ports:
      - "10808:10808"
      - "10809:10809"
    restart: unless-stopped

  db:
    image: docker.arvancloud.ir/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    # ports:
    #   - "5432:5432"  # Add this line to expose the port
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.arvancloud.ir/redis:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: docker.arvancloud.ir/nginx:1.25-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./link-shortener-frontend/dist:/usr/share/nginx/html/pages
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    # - ./nginx/conf.d:/etc/nginx/conf.d
    # - ./nginx/conf:/etc/nginx/conf.d
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - /var/www/letsencrypt:/var/www/letsencrypt:ro

    networks:
      - 1sl_default
      - mailcowdockerized_mailcow-network
    depends_on:
      - app
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: app_pgadmin
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 1sl_default # مهم: قرار دادن در شبکه مشترک با Nginx و DB
    # مهم: پورت‌ها را اینجا expose نکنید. Nginx مدیریت را انجام می‌دهد.
  
volumes:
  postgres_data:
  pgadmin_data: # اضافه کردن Volume جدید برای pgAdmin

networks:
  1sl_default:
    external: true

  mailcowdockerized_mailcow-network:
    external: true