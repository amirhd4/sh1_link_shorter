services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      - DEBUG=False
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

    volumes:
      - ./app/alembic:/app/alembic
      - ./app/alembic.ini:/app/alembic.ini


    depends_on:
      - db
      - cache
      # - xray

  click_processor:
    build:
      context: ./app
    command: python -m src.services.click_processor  # دستور واحد برای اجرای این سرویس
    env_file: .env
    depends_on:
      - db
      - cache
    deploy:
      resources:
        limits:
          memory: 256M # حافظه تقسیم شده
    volumes:
      - ./app:/app
    restart: always # برای تضمین اجرای مداوم سرویس

#    # سرویس دوم: مصرف‌کننده پرش از تبلیغ
