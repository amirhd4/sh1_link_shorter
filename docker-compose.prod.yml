  # xray:
  #   build: ./xray
  #   container_name: xray
  #   ports:
  #     # - "10808:10808"
  #     # - "10809:10809"
  #     - "127.0.0.1:10808:10808"  # فقط localhost کانتینر میزبان
  #   deploy:
  #     resources:
  #       limits:
